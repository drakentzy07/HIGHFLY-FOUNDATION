name: HIGHFLY F4 Real World + Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout ONLY pinned MIT WOC 0.44.7 source code
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 493c35a108cef6c8aa290e8793107b1cd117886e
          path: .vendor/world-of-claudecraft
          sparse-checkout: |
            src
            LICENSE
            CREDITS.md
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Verify upstream source license and pinned version
        run: |
          test "$(git -C .vendor/world-of-claudecraft rev-parse HEAD)" = '493c35a108cef6c8aa290e8793107b1cd117886e'
          grep -qi 'MIT License' .vendor/world-of-claudecraft/LICENSE
          grep -q 'Medieval Village Pack' .vendor/world-of-claudecraft/CREDITS.md
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install same renderer/build versions as WOC 0.44.7
        run: npm install --no-audit --no-fund
      - name: Test Hunter logic
        run: npm test
      - name: Download ONLY approved CC0 KayKit character GLBs
        shell: bash
        run: |
          set -euo pipefail
          ref='672074b73ba276876a19e8816ecdc5241817ab47'
          base="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/$ref/addons/kaykit_character_pack_adventures"
          mkdir -p public/assets/kaykit
          curl -fL --retry 3 "$base/Characters/gltf/Knight.glb" -o public/assets/kaykit/Knight.glb
          curl -fL --retry 3 "$base/Characters/gltf/Mage.glb" -o public/assets/kaykit/Mage.glb
          curl -fL --retry 3 "$base/Characters/gltf/Rogue.glb" -o public/assets/kaykit/Rogue.glb
          curl -fL --retry 3 "$base/LICENSE.txt" -o public/assets/kaykit/LICENSE.txt
          test "$(git hash-object public/assets/kaykit/Knight.glb)" = '717b56ca2b5ff5392679774725201ba03a3eefab'
          test "$(git hash-object public/assets/kaykit/Mage.glb)" = 'c89f19f6e707f6e07e4632a08876bd6d0172b082'
          test "$(git hash-object public/assets/kaykit/Rogue.glb)" = 'c8827661105eef7b2bfbef3bc676d41a47625733'
          echo 'KayKit CC0 GLB asset hashes validated.'
      - name: Import ONLY CC0 WOC v0.44.7 Medieval Village + Wolf models
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/levy-street/world-of-claudecraft/493c35a108cef6c8aa290e8793107b1cd117886e/public/models'
          mkdir -p public/assets/woc-cc0
          # Assets already used in the WOC world. CREDITS.md confirms the
          # Quaternius Medieval Village & animated wolf models are CC0.
          curl -fsSL --retry 4 "$base/props/house_1.glb" -o public/assets/woc-cc0/house_1.glb
          curl -fsSL --retry 4 "$base/props/house_2.glb" -o public/assets/woc-cc0/house_2.glb
          curl -fsSL --retry 4 "$base/props/house_3.glb" -o public/assets/woc-cc0/house_3.glb
          curl -fsSL --retry 4 "$base/props/inn.glb" -o public/assets/woc-cc0/inn.glb
          curl -fsSL --retry 4 "$base/props/well.glb" -o public/assets/woc-cc0/well.glb
          curl -fsSL --retry 4 "$base/props/blacksmith.glb" -o public/assets/woc-cc0/blacksmith.glb
          curl -fsSL --retry 4 "$base/creatures/wolf.glb" -o public/assets/woc-cc0/wolf.glb
          curl -fsSL --retry 4 "$base/foliage/pine_1.glb" -o public/assets/woc-cc0/pine_1.glb
          curl -fsSL --retry 4 "$base/foliage/oak_1.glb" -o public/assets/woc-cc0/oak_1.glb
          curl -fsSL --retry 4 "$base/foliage/twisted_1.glb" -o public/assets/woc-cc0/twisted_1.glb
          curl -fsSL --retry 4 "$base/foliage/rock_1.glb" -o public/assets/woc-cc0/rock_1.glb
          test "$(git hash-object public/assets/woc-cc0/house_1.glb)" = '88f7b20a2b4376a53c6e9444910386b1a8a5f510'
          test "$(git hash-object public/assets/woc-cc0/house_2.glb)" = 'fb45ec1b03e81dc37e133569e91a666e79d4470b'
          test "$(git hash-object public/assets/woc-cc0/house_3.glb)" = '5cece5805e034c57a1581645e8ddf1f2962ee269'
          test "$(git hash-object public/assets/woc-cc0/inn.glb)" = 'e65e40883afe48b6c3f4da389d73efc9acd60290'
          test "$(git hash-object public/assets/woc-cc0/well.glb)" = 'a80bb7f20e048621195e300e58a0aebbcc83af66'
          test "$(git hash-object public/assets/woc-cc0/blacksmith.glb)" = 'a654d0fb8cdaeca95e45a4a97086b0e072374a34'
          test "$(git hash-object public/assets/woc-cc0/wolf.glb)" = '00d69a6c127752c2506c66bc93db9a10f4a73df0'
          test "$(git hash-object public/assets/woc-cc0/pine_1.glb)" = '43e0328735bcca037ac87f32c11a9b9b52cb11fa'
          test "$(git hash-object public/assets/woc-cc0/oak_1.glb)" = 'decbef02a1a2a5904232b60b1fae8e5c2fd1e5d3'
          test "$(git hash-object public/assets/woc-cc0/twisted_1.glb)" = 'f649826c05d7de2cf307917c073c3ed952fcc093'
          test "$(git hash-object public/assets/woc-cc0/rock_1.glb)" = '9a89d0ed1ddaadda62938c487c3279999c370c58'
          cp .vendor/world-of-claudecraft/CREDITS.md public/assets/woc-cc0/WOC-CREDITS.md
          echo 'ONLY pinned CC0 world assets verified by Git blob SHA.'
      - name: Build browser entry
        run: npm run build:app
      - name: Upload static build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Enable Pages (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1 || \
            gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - id: deploy
        name: Publish HIGHFLY native world
        uses: actions/deploy-pages@v4
      - name: Verify public entry and KayKit model URL
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          # Pages can take a little time to propagate to its public hostname.
          for attempt in $(seq 1 12); do
            if curl -fsSL --connect-timeout 8 --max-time 18 "${PAGE_URL}" -o /tmp/highfly-page.html; then
              break
            fi
            echo "Public entry not ready: attempt $attempt"
            sleep 5
          done
          grep -qi "HIGHFLY" /tmp/highfly-page.html
          curl -fsSIL --retry 8 --retry-delay 5 --retry-all-errors "${PAGE_URL}assets/kaykit/Knight.glb" >/dev/null
          curl -fsSIL --retry 8 --retry-delay 5 --retry-all-errors "${PAGE_URL}assets/woc-cc0/house_1.glb" >/dev/null
          echo "PUBLIC_HIGHFLY_NATIVE_WOC_AND_CC0_ASSETS_OK"
