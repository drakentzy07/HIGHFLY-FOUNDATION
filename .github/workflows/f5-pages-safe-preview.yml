name: F5 Pages legal-world preview (QA-gated public deploy)
on:
  push:
    branches: [experiment/f5-pages-safe-preview]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  f5-safe-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Checkout HIGHFLY F5 scripts
        uses: actions/checkout@v4
      - name: Checkout pinned WOC full engine
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 493c35a108cef6c8aa290e8793107b1cd117886e
          path: upstream/world-of-claudecraft
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original WOC dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          cd upstream/world-of-claudecraft
          pnpm install --frozen-lockfile
      - name: Wire HIGHFLY experimental native HUD and original world launch
        run: |
          node scripts/f5-install-local-launcher.mjs upstream/world-of-claudecraft
          node scripts/f5-wire-native-hud.mjs upstream/world-of-claudecraft
      - name: Scope Vite and GLB/KTX loader to /HIGHFLY-FOUNDATION/f5/
        run: node scripts/f5-pages-prefix.mjs upstream/world-of-claudecraft
      - name: Build FULL WOC original world engine + editor
        run: |
          cd upstream/world-of-claudecraft
          pnpm run build
          node scripts/build_media_manifest.mjs prune
      - name: Copy exclusively confirmed-permission media and code to release review
        run: node scripts/f5-pages-licensed-subset.mjs upstream/world-of-claudecraft f5-public-review
      - name: Protect Pages bundle size and attribution
        shell: bash
        run: |
          set -euo pipefail
          test -s f5-public-review/index.html
          test -s f5-public-review/editor.html
          test -s f5-public-review/CREDITS.md
          test -s f5-public-review/LICENSE
          test -s f5-public-review/HIGHFLY_F5_RELEASE_SCOPE.json
          bytes=$(du -sb f5-public-review | awk '{print $1}')
          echo "F5_SAFE_PAGES_MIB=$((bytes/1048576))"
          test "$bytes" -lt 1073741824
          ! find f5-public-review -type f -name '*.apk' | grep .
          ! find f5-public-review -type f -path '*/ui/skills/*' | grep .
          echo F5_LICENSED_MEDIA_SCOPE_GATE_GREEN
      - name: Install Chromium for genuine touch emulation
        working-directory: upstream/world-of-claudecraft
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke full world + mobile HUD, then editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p f5-http-root/HIGHFLY-FOUNDATION
          ln -s "$PWD/f5-public-review" f5-http-root/HIGHFLY-FOUNDATION/f5
          python3 -m http.server 8765 --bind 127.0.0.1 --directory f5-http-root >/tmp/highfly-f5-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cp scripts/f5-pages-browser-smoke.mjs upstream/world-of-claudecraft/f5-pages-browser-smoke.mjs
          cd upstream/world-of-claudecraft
          F5_TEST_URL=http://127.0.0.1:8765/HIGHFLY-FOUNDATION/f5 node f5-pages-browser-smoke.mjs
          curl -fsSL http://127.0.0.1:8765/HIGHFLY-FOUNDATION/f5/editor.html -o /tmp/highfly-f5-editor
          grep -qi '<html' /tmp/highfly-f5-editor
          echo F5_PAGES_LICENCED_SUBSET_BROWSER_GREEN
      - name: Checkout existing stable HIGHFLY F4 from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-f4
      - name: Rebuild the preserved HIGHFLY F4 homepage
        shell: bash
        working-directory: stable-f4
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          ref='672074b73ba276876a19e8816ecdc5241817ab47'
          base="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/$ref/addons/kaykit_character_pack_adventures"
          mkdir -p public/assets/kaykit
          for glb in Knight Mage Rogue; do curl -fL --retry 3 "$base/Characters/gltf/$glb.glb" -o "public/assets/kaykit/$glb.glb"; done
          curl -fL --retry 3 "$base/LICENSE.txt" -o public/assets/kaykit/LICENSE.txt
          test "$(git hash-object public/assets/kaykit/Knight.glb)" = '717b56ca2b5ff5392679774725201ba03a3eefab'
          test "$(git hash-object public/assets/kaykit/Mage.glb)" = 'c89f19f6e707f6e07e4632a08876bd6d0172b082'
          test "$(git hash-object public/assets/kaykit/Rogue.glb)" = 'c8827661105eef7b2bfbef3bc676d41a47625733'
          npm run build:app
      - name: Assemble one Pages site with F4 at root and F5 at /f5/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-combined/f5
          cp -a stable-f4/dist/. pages-combined/
          cp -a f5-public-review/. pages-combined/f5/
          test -s pages-combined/index.html
          test -s pages-combined/assets/kaykit/Knight.glb
          test -s pages-combined/f5/index.html
          test -s pages-combined/f5/HIGHFLY_F5_RELEASE_SCOPE.json
          bytes=$(du -sb pages-combined | awk '{print $1}')
          echo "F5_PAGES_COMBINED_BYTES=$bytes"
          test "$bytes" -lt 1073741824
          echo F5_PAGES_BOTH_VERSIONS_STAGED
      - name: Upload QA-verified Pages site (not raw WOC assets)
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-combined
      - name: Report metadata only, never upload build before review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-pages-license-scope-json
          path: f5-public-review/HIGHFLY_F5_RELEASE_SCOPE.json
          if-no-files-found: ignore
          retention-days: 7

  deploy-f5:
    if: github.ref == 'refs/heads/experiment/f5-pages-safe-preview'
    needs: f5-safe-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy tested F4 root plus F5 legal subset
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live F4 root + F5 online page
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for try in $(seq 1 12); do
            if curl -fsSL --max-time 20 "$PAGE_URL" -o /tmp/f4-home &&
               curl -fsSL --max-time 20 "${PAGE_URL}f5/" -o /tmp/f5-home; then break; fi
            sleep 5
          done
          grep -qi 'HIGHFLY' /tmp/f4-home
          grep -q 'HIGHFLY' /tmp/f5-home
          echo F5_PAGES_PUBLIC_F4_AND_F5_ONLINE
