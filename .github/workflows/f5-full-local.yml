name: F5 FULL local WOC world + editor (no publication)
on:
  push:
    branches: [experiment/f5-full-local-world, experiment/f5-integrated-world-hud]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-complete-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Checkout HIGHFLY integration scripts
        uses: actions/checkout@v4
      - name: Checkout exact FULL WOC v0.44.7 into ephemeral runner
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 493c35a108cef6c8aa290e8793107b1cd117886e
          path: upstream/world-of-claudecraft
          persist-credentials: false
      - name: Verify pristine original source and credit notice
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/world-of-claudecraft rev-parse HEAD)" = "493c35a108cef6c8aa290e8793107b1cd117886e"
          test -s upstream/world-of-claudecraft/src/sim/world.ts
          test -s upstream/world-of-claudecraft/src/editor/main.ts
          test -s upstream/world-of-claudecraft/CREDITS.md
          test -s upstream/world-of-claudecraft/LICENSE
          echo "F5_FULL_WORLD_EDITOR_SOURCE_PRESENT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install upstream dependencies
        working-directory: upstream/world-of-claudecraft
        run: pnpm install --frozen-lockfile
      - name: Add separate HIGHFLY local launch page without changing original game
        run: node scripts/f5-install-local-launcher.mjs upstream/world-of-claudecraft
      - name: Inject HIGHFLY mobile HUD on native WOC World input
        run: node scripts/f5-wire-native-hud.mjs upstream/world-of-claudecraft
      - name: Compile full original world and editor with local launch page
        working-directory: upstream/world-of-claudecraft
        run: pnpm run build
      - name: Audit Pages size and licenses (metadata only, blocked by default)
        run: node scripts/f5-pages-plan.mjs upstream/world-of-claudecraft f5-pages-plan
      - name: Save JSON feasibility report, never original assets
        uses: actions/upload-artifact@v4
        with:
          name: f5-pages-readiness-json
          path: f5-pages-plan/F5-PAGES-READINESS.json
          retention-days: 7
      - name: Remove ONLY original-source duplicate media using upstream's tested native packager
        working-directory: upstream/world-of-claudecraft
        run: node scripts/build_media_manifest.mjs prune
      - name: Verify full engine below Pages size limit WITHOUT distributing it
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(du -sb upstream/world-of-claudecraft/dist | awk '{print $1}')
          echo "F5_NATIVE_PRUNE_BYTES=$bytes"
          echo "F5_NATIVE_PRUNE_MIB=$((bytes / 1048576))"
          if [ "$bytes" -ge 1073741824 ]; then
            echo 'F5_PAGES_SIZE_STILL_EXCEEDS_LIMIT'
            exit 1
          fi
          test -s upstream/world-of-claudecraft/dist/index.html
          test -s upstream/world-of-claudecraft/dist/editor.html
          echo 'F5_FULL_WORLD_AFTER_SAFE_PRUNE_BELOW_PAGES_SIZE_CAP'
      - name: Smoke-test compiled world/editor/overlay over HTTP (no public deployment)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory upstream/world-of-claudecraft/dist > /tmp/highfly-f5-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for x in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8765/highfly-f5-local.html -o /tmp/hf5entry; then break; fi
            sleep 1
          done
          grep -q 'HIGHFLY FOUNDATION' /tmp/hf5entry
          curl -fsS http://127.0.0.1:8765/index.html -o /tmp/hf5main
          curl -fsS http://127.0.0.1:8765/editor.html -o /tmp/hf5editor
          test -s /tmp/hf5main
          test -s /tmp/hf5editor
          grep -Rlq 'highfly-f5-hud' upstream/world-of-claudecraft/dist/assets
          echo 'F5_HTTP_SMOKE_GREEN_WORLD_EDITOR_NATIVE_HUD'
      - name: Verify local launcher, editor and original world compiled
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/world-of-claudecraft/dist/index.html
          test -s upstream/world-of-claudecraft/dist/highfly-f5-local.html
          test -s upstream/world-of-claudecraft/dist/editor.html
          grep -q 'HIGHFLY FOUNDATION' upstream/world-of-claudecraft/dist/highfly-f5-local.html
          grep -q 'href="/editor"' upstream/world-of-claudecraft/dist/highfly-f5-local.html
          grep -q 'installHighflyF5TouchHud' upstream/world-of-claudecraft/src/main.ts
          echo 'F5_LOCAL_FULL_WORLD_EDITOR_HUD_BUILD_GREEN'
          echo 'SAFETY: no WOC source, media, dist, or finished game uploaded or published.'
